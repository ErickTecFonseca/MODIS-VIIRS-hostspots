<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireScope - Detecciones por año</title>

    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f4f4; color: #222; }
        h1 { color: #e25822; }
        .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        select, input, button { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { background: #e25822; color: white; cursor: pointer; border: none; }
        button:hover:not(:disabled) { background: #bd4318; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin: 15px 0; }
        .pager { display: flex; gap: 12px; align-items: center; margin: 12px 0; }
        .table-container { overflow-x: auto; background: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; white-space: nowrap; }
        th { background: #333; color: white; }
        tr:hover { background: #f1f1f1; }
    </style>
</head>

<body>

    <h1>FireScope</h1>
    <p>Consulta de detecciones satelitales de incendios por año</p>

    <div class="controls">
        <select id="sensor">
            <option value="MODIS">MODIS</option>
            <option value="VIIRS">VIIRS</option>
        </select>

        <select id="year"></select>

        <select id="month">
            <option value="">Todo el año</option>
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
        </select>

        <input id="country" type="text" placeholder="País (ej. Albania)">

        <select id="limit">
            <option value="50">50 por página</option>
            <option value="100" selected>100 por página</option>
            <option value="500">500 por página</option>
            <option value="1000">1000 por página</option>
        </select>

        <button id="searchButton">Consultar datos</button>
    </div>

    <div id="status">Selecciona un año y presiona "Consultar datos".</div>

    <div class="pager">
        <button id="prevButton" disabled>← Anterior</button>
        <span id="pageInfo"></span>
        <button id="nextButton" disabled>Siguiente →</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>País</th>
                    <th>Sensor</th>
                    <th>Satélite</th>
                    <th>Latitud</th>
                    <th>Longitud</th>
                    <th>Fecha</th>
                    <th>Hora (UTC)</th>
                    <th>FRP</th>
                    <th>Confidence</th>
                    <th>Día/Noche</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        const FIRST_YEAR = 2000, LAST_YEAR = 2025, VIIRS_FIRST_YEAR = 2018;

        const sensorSelect = document.getElementById("sensor");
        const yearSelect = document.getElementById("year");
        const monthSelect = document.getElementById("month");
        const countryInput = document.getElementById("country");
        const limitSelect = document.getElementById("limit");
        const searchButton = document.getElementById("searchButton");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");
        const pageInfo = document.getElementById("pageInfo");
        const status = document.getElementById("status");
        const dataTable = document.getElementById("dataTable");

        let offset = 0;
        let total = 0;

        // Llenar años (VIIRS solo desde 2018, igual que la API)
        function fillYears() {
            const previous = yearSelect.value;
            const min = sensorSelect.value === "VIIRS" ? VIIRS_FIRST_YEAR : FIRST_YEAR;
            yearSelect.innerHTML = "";
            for (let y = LAST_YEAR; y >= min; y--) {
                yearSelect.add(new Option(y, y));
            }
            if (previous && previous >= min) yearSelect.value = previous;
        }

        function formatTime(t) {
            if (t == null) return "N/A";
            const s = String(t).padStart(4, "0");
            return `${s.slice(0, 2)}:${s.slice(2)}`;
        }

        // Consultar API
        async function getFires() {
            const url = new URL(`${API_URL}/fires`);
            url.searchParams.set("sensor", sensorSelect.value);
            url.searchParams.set("year", yearSelect.value);
            if (monthSelect.value) url.searchParams.set("month", monthSelect.value);
            if (countryInput.value.trim()) url.searchParams.set("country", countryInput.value.trim());
            url.searchParams.set("limit", limitSelect.value);
            url.searchParams.set("offset", offset);

            status.textContent = "Consultando datos...";
            dataTable.innerHTML = "";
            prevButton.disabled = nextButton.disabled = true;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}`);
                }

                const result = await response.json();
                total = result.total;

                const periodo = result.month ? `${monthSelect.selectedOptions[0].text} ${result.year}` : `${result.year}`;
                status.textContent = total === 0
                    ? `Sin detecciones de ${result.sensor} en ${periodo}.`
                    : `${total.toLocaleString("es-MX")} detecciones de ${result.sensor} en ${periodo}.`;

                renderRows(result);
                updatePager(result);

            } catch (error) {
                status.textContent = `No se pudieron obtener los datos: ${error.message}`;
                console.error(error);
            }
        }

        function renderRows(result) {
            result.data.forEach(fire => {
                const row = document.createElement("tr");

                const values = [
                    fire.country,
                    result.sensor,           // la API lo envía a nivel de respuesta, no por registro
                    fire.satellite,
                    fire.latitude,
                    fire.longitude,
                    fire.acq_date,
                    formatTime(fire.acq_time),
                    fire.frp,
                    fire.confidence,
                    fire.daynight
                ];

                values.forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value ?? "N/A";
                    row.appendChild(cell);
                });

                dataTable.appendChild(row);
            });
        }

        function updatePager(result) {
            const from = result.count ? result.offset + 1 : 0;
            const to = result.offset + result.count;
            pageInfo.textContent = total ? `Mostrando ${from.toLocaleString("es-MX")}–${to.toLocaleString("es-MX")}` : "";
            prevButton.disabled = result.offset === 0;
            nextButton.disabled = to >= total;
        }

        // Eventos
        sensorSelect.addEventListener("change", fillYears);
        searchButton.addEventListener("click", () => { offset = 0; getFires(); });
        prevButton.addEventListener("click", () => { offset = Math.max(0, offset - Number(limitSelect.value)); getFires(); });
        nextButton.addEventListener("click", () => { offset += Number(limitSelect.value); getFires(); });

        fillYears();
    </script>

</body>
</html>
